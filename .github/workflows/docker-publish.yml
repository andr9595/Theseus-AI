name: docker

on:
  push:
    branches: [main, 'docker-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real test this repo has for the image: it has to actually start
      # and answer a request, the same proof the plain-Python smoke test in
      # tests.yml asks of a bare `python -m aicouncil`.
      - name: Build the image
        run: docker build -t ai-council:smoke .

      - name: Smoke test - the container serves the dashboard
        run: |
          docker run -d --name smoke -p 18760:8760 \
            -e AI_COUNCIL_TOKEN=smoke-test-token \
            ai-council:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18760/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200" || { echo "container never answered (last: $code)"; docker logs smoke; exit 1; }
          echo "dashboard served OK"
          # The token gate has to survive the container boundary too - a
          # request with no token should still be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18760/api/state)
          test "$code" = "401" || { echo "expected 401 with no token, got $code"; exit 1; }
          echo "auth gate OK"
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
